name: Auto Key

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Key
        run: |
          python << EOF
          import random
          import string

          chars = string.ascii_letters + string.digits

          key = ''.join(
              random.choice(chars)
              for _ in range(32)
          )

          with open("key.txt", "w") as f:
              f.write(key)

          print("New key:", key)
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add key.txt

          git diff --cached --quiet || (
            git commit -m "Auto update key"
            git push
          )
